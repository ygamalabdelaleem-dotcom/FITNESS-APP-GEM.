<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#154d40">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="description" content="أكلي: يوميات تغذية مصرية تراعي يوم شغلك">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="stylesheet" href="./style.css">
  <title>أكلي • يومك بتوازن</title>
</head>
<body>
  <div class="app">
    <aside>
      <a class="brand" href="#today"><span>◉</span> أكلي<small>خطوة صغيرة، كل يوم</small></a>
      <nav>
        <button data-tab="today" class="active">◷ <span>يومي</span></button>
        <button data-tab="foods">＋ <span>سجل أكلك</span></button>
        <button data-tab="insights">▥ <span>متابعتي</span></button>
        <button data-tab="settings">⚙ <span>إعداداتي</span></button>

      <div class="side-note">أكل مصري، اختيارات أذكى.<br>في البيت أو وسط يوم الشغل.</div>
    </aside>
    <main>
      <header>
        <span class="eyebrow">مساحة صغيرة لصحتك</span>
        <span class="badge">بياناتك على جهازك 🔒</span>

      <div id="view"></div>
      <footer>
        أكلي مساعد للتسجيل والتوعية، وليس تشخيصًا أو بديلًا لمختص التغذية.
        <a href="https://www.who.int/news-room/fact-sheets/detail/healthy-diet" target="_blank" rel="noopener">إرشادات الغذاء</a> ·
        <a href="https://ods.od.nih.gov/factsheets/WYNTK-Consumer/" target="_blank" rel="noopener">عن المكملات</a>
      </footer>
    </main>
  </div>
  <dialog id="food-dialog"></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="./app.js"></script>
